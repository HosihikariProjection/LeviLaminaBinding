name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  managed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: IR contract
        uses: actions/checkout@v4
        with:
          repository: HosihikariProjection/BindingIr
          path: Binding.Ir

      - name: Generator
        uses: actions/checkout@v4
        with:
          repository: HosihikariProjection/BindingGenerator
          path: Binding.Generator

      - name: ABI contract
        uses: actions/checkout@v4
        with:
          repository: HosihikariProjection/BindingAbi
          ref: 2ee2a0d989f8cd1690077c1426ccf4beb1ec92c3
          path: Binding.Abi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build Hosihikari.Binding.LeviLamina.slnx -c Release -p:AbiProjectPath=${{ github.workspace }}/Binding.Abi/src/Hosihikari.Binding.Abi/Hosihikari.Binding.Abi.csproj

      - name: Verify generated sources
        run: python3 scripts/verify_generated.py

      - name: Validate coverage contract
        run: dotnet run --project Binding.Generator/src/Hosihikari.Binding.Generator/Hosihikari.Binding.Generator.csproj -c Release -- validate-coverage coverage/summary.json coverage/manifest.jsonl

      - name: Formatting
        run: dotnet format Hosihikari.Binding.LeviLamina.slnx --verify-no-changes
